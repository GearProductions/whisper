name: CI

# Vérifications à chaque PR et push sur master. Paquets autonomes (exe
# portable Windows, AppImage Linux) seulement pour une nouvelle version : un
# tag vX.Y.Z construit les paquets et crée sa Release GitHub avec eux (un tag
# vX.Y.Z-rc.N : une pré-version, pour essayer avant la version officielle). Lancé à
# la main (workflow_dispatch), il construit les paquets sans rien publier
# (artefacts de l'onglet Actions).
on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Typage, tests (invariants et variants) et construction des pages et du
  # principal, sur les deux systèmes visés.
  syntaxe:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # L'assistant PowerShell (collage, Ctrl+C, micro Discord) ne peut être essayé
  # que sous Windows : on le compile et on vérifie ses réponses, avec le même
  # powershell.exe (5.1) que l'appli. Sans Discord ni micro sur le runner, la
  # coupure trouve 0 flux. Pas de `copy` ni de `paste` : ils frappent au
  # clavier, et un Ctrl+C dans la console du runner l'interrompt.
  assistant-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: windows-helper.ps1
        shell: pwsh
        run: |
          $commands = "discord-mute`ndiscord-restore`nothers-mute 1,2`nothers-restore`ninconnue`n"
          $out = $commands | powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File resources/scripts/windows-helper.ps1
          $lines = @($out | Where-Object { $_ -ne '' })
          # Les coupures répondent un nombre (0 sans Discord ; le runner peut
          # avoir une session de sons système côté lecture).
          $expected = @('^0$', '^ok$', '^\d+$', '^ok$', '^err$')
          Write-Host "Réponses : $($lines -join ', ')"
          $ok = $lines.Count -eq $expected.Count
          for ($i = 0; $ok -and $i -lt $expected.Count; $i++) { $ok = $lines[$i] -match $expected[$i] }
          if (-not $ok) {
            Write-Error "Attendu : $($expected -join ', ')"
            exit 1
          }

  # Paquet autonome : l'appli + whisper-cli (Vulkan, repli processeur) + uv.
  # Les modèles (whisper, Pocket TTS) sont téléchargés par l'appli au premier
  # usage : trop lourds pour le paquet.
  paquet:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [syntaxe]
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 : une glibc assez ancienne pour que l'AppImage tourne sur la
          # plupart des distributions.
          - os: ubuntu-22.04
            cible: linux
            fichiers: dist/*.AppImage
          - os: windows-latest
            cible: windows
            fichiers: dist/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: SDK Vulkan (glslc, en-têtes)
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          cache: true
          stripdown: true
      - name: whisper-cli
        shell: bash
        run: scripts/build-whisper.sh
      # Le binaire embarqué démarre-t-il (bibliothèques trouvées) et transcrit-il ?
      # Pas de GPU sur le runner : c'est aussi l'essai du repli sur le processeur.
      - name: Essai de whisper-cli (plus petit modèle)
        shell: bash
        run: |
          curl -fsSL -o ggml-tiny.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          out="$(resources/bin/whisper-cli -m ggml-tiny.en.bin -l en -nt -np -f build/whisper.cpp/samples/jfk.wav)"
          echo "$out"
          grep -qi "ask not what your country" <<< "$out"
          rm ggml-tiny.en.bin
      - name: uv
        shell: bash
        run: scripts/fetch-uv.sh ${{ matrix.cible }}
      - name: Version du tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm ci
      - name: Paquet
        shell: bash
        run: npm run dist:${{ matrix.cible == 'windows' && 'win' || 'linux' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # pas de signature de code
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-dictation-${{ matrix.cible }}
          path: ${{ matrix.fichiers }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [paquet, assistant-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: paquets/*
          generate_release_notes: true
          # Version de test (v0.3.0-rc.1…) : pré-version, la « Latest » ne bouge pas.
          prerelease: ${{ contains(github.ref_name, '-') }}
