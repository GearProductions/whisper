name: CI

# Vérifications et paquets autonomes (exe portable Windows, AppImage Linux) :
# construits à chaque PR et à chaque push sur master (artefacts de l'onglet
# Actions), publiés dans une Release GitHub sur un tag vX.Y.Z.
on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Syntaxe du code de l'appli, sur les deux systèmes visés.
  syntaxe:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: node --check
        shell: bash
        run: for f in src/*.js; do node --check "$f"; done

  # L'assistant PowerShell (collage, Ctrl+C, micro Discord) ne peut être essayé
  # que sous Windows : on le compile et on vérifie ses réponses, avec le même
  # powershell.exe (5.1) que l'appli. Sans Discord ni micro sur le runner, la
  # coupure trouve 0 flux. Pas de `copy` ni de `paste` : ils frappent au
  # clavier, et un Ctrl+C dans la console du runner l'interrompt.
  assistant-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: windows-helper.ps1
        shell: pwsh
        run: |
          $commands = "discord-mute`ndiscord-restore`ninconnue`n"
          $out = $commands | powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File src/windows-helper.ps1
          $lines = @($out | Where-Object { $_ -ne '' })
          $expected = @('0', 'ok', 'err')
          Write-Host "Réponses : $($lines -join ', ')"
          if (($lines -join ',') -ne ($expected -join ',')) {
            Write-Error "Attendu : $($expected -join ', ')"
            exit 1
          }

  # Paquet autonome : l'appli + whisper-cli (Vulkan, repli processeur) + uv.
  # Les modèles (whisper, Pocket TTS) sont téléchargés par l'appli au premier
  # usage : trop lourds pour le paquet.
  paquet:
    needs: [syntaxe]
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 : une glibc assez ancienne pour que l'AppImage tourne sur la
          # plupart des distributions.
          - os: ubuntu-22.04
            cible: linux
            fichiers: dist/*.AppImage
          - os: windows-latest
            cible: windows
            fichiers: dist/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: SDK Vulkan (glslc, en-têtes)
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          cache: true
          stripdown: true
      - name: whisper-cli
        shell: bash
        run: scripts/build-whisper.sh
      - name: uv
        shell: bash
        run: scripts/fetch-uv.sh ${{ matrix.cible }}
      - name: Version du tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
      - run: npm ci
      - name: Paquet
        shell: bash
        run: npm run dist:${{ matrix.cible == 'windows' && 'win' || 'linux' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # pas de signature de code
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-dictation-${{ matrix.cible }}
          path: ${{ matrix.fichiers }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [paquet, assistant-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: paquets/*
          generate_release_notes: true
