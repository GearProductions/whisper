<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Whisper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="icon" data-phase="idle" title="Maintenir pour dicter · glisser pour déplacer · clic droit : réglages">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7" fill="none"/>
    </svg>
  </div>
  <!-- Petits boutons accolés à l'icône : lecture, agents (générés), ajout. -->
  <div id="side">
    <button id="play" class="small" type="button" data-phase="idle" aria-label="Lire à voix haute">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="i-play" d="M8 5.5v13l10.5-6.5z"/>
        <rect class="i-stop" x="6.5" y="6.5" width="11" height="11" rx="1.5"/>
      </svg>
    </button>
    <div id="agents"></div>
    <button id="add" class="small" type="button" title="Agents Claude Code : ajouter un dossier, autres agents" aria-label="Ajouter un agent">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" fill="none"/></svg>
    </button>
  </div>
  <template id="agent-template">
    <button class="small agent" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3v3" fill="none"/>
        <rect x="5" y="6.5" width="14" height="11" rx="3" fill="none"/>
        <circle cx="9.5" cy="12" r="1.4"/><circle cx="14.5" cy="12" r="1.4"/>
        <path d="M3 11v3M21 11v3M9 20.5h6" fill="none"/>
      </svg>
      <span class="badge"></span>
    </button>
  </template>
  <script src="renderer.js"></script>
</body>
</html>
