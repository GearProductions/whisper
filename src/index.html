<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Whisper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="icon" data-phase="idle" title="Maintenir pour dicter · glisser pour déplacer · clic droit : réglages">

      <rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7" fill="none"/>

  </div>
  <button id="play" type="button" data-phase="idle" aria-label="Lire à voix haute">

      <path class="i-play" d="M8 5.5v13l10.5-6.5z"/>
      <rect class="i-stop" x="6.5" y="6.5" width="11" height="11" rx="1.5"/>
    </svg>
  </button>
