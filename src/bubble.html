<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Whisper — texte</title>
  <link rel="stylesheet" href="scroll.css">
  <link rel="stylesheet" href="bubble.css">
</head>
<body>
  <div id="bubble" title="Cliquer pour copier">
    <div id="title" hidden></div>
    <div id="asked" hidden title="Votre message (clic : en entier)"></div>
    <div id="text" class="scroll"></div>
    <div id="volume" hidden>
      <input id="volume-range" type="range" min="0" max="100" step="5" aria-label="Volume de lecture">
      <span id="volume-value"></span>
    </div>
    <div id="actions" hidden>
      <button id="act-speak" type="button" data-act="speak">▶ Écouter</button>
      <button id="act-allow" type="button" data-act="allow">Autoriser</button>
      <button id="act-always" type="button" data-act="always">Toujours autoriser</button>
      <button id="act-deny" type="button" data-act="deny">Refuser</button>
    </div>
    <div id="always" hidden></div>
    <div id="hint">Cliquer pour copier</div>
  </div>
  <button id="expand" type="button" title="Agrandir : toute la conversation, dans une fenêtre" aria-label="Agrandir" hidden>⤢</button>
  <button id="close" type="button" title="Fermer" aria-label="Fermer">×</button>
  <script src="links.js"></script>
  <script src="bubble.js"></script>
</body>
</html>
