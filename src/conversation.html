<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data: blob:">
  <title>Whisper — conversations</title>
  <link rel="stylesheet" href="scroll.css">
  <link rel="stylesheet" href="conversation.css">
</head>
<body>
  <nav id="tabs" class="scroll"></nav>
  <header>
    <span id="dot"></span>
    <div id="heading">
      <div id="title"></div>
      <div id="sub"></div>
    </div>
    <button id="history-button" type="button" title="Les conversations passées de ce dossier">🕘 Historique</button>
    <button id="hide" type="button" title="Masquer le panneau (les onglets sont gardés)" aria-label="Masquer">×</button>
  </header>
  <div id="archived" hidden>
    <span>Ancienne conversation : en lecture seule.</span>
    <button id="resume" type="button">Reprendre cette conversation</button>
  </div>
  <div id="body">
    <main id="thread" class="scroll"></main>
    <aside id="history" class="scroll" hidden></aside>
  </div>
  <footer id="composer" hidden>
    <div id="pieces"></div>
    <div id="composer-row">
      <button id="attach" type="button" title="Joindre des images, des fichiers ou le texte sélectionné (aussi : glisser-déposer, Ctrl+V)">📎</button>
      <textarea id="message" class="scroll" rows="1" placeholder="Écrire un message… (Entrée : envoyer, Maj+Entrée : à la ligne)"></textarea>
      <button id="send" type="button" title="Envoyer (Entrée)">Envoyer</button>
    </div>
    <div id="composer-status"></div>
  </footer>
  <div id="lightbox" hidden><img alt=""></div>
  <template id="tab-template">
    <div class="tab" role="tab">
      <span class="tab-dot"></span>
      <span class="tab-title"></span>
      <button class="tab-close" type="button" title="Fermer l'onglet" aria-label="Fermer l'onglet">×</button>
    </div>
  </template>
  <template id="permission-template">
    <article class="permission">
      <div class="permission-title"></div>
      <pre class="permission-text"></pre>
      <div class="permission-always" hidden></div>
      <div class="permission-actions">
        <button type="button" data-act="allow" class="allow">Autoriser</button>
        <button type="button" data-act="always" class="allow">Toujours autoriser</button>
        <button type="button" data-act="deny" class="deny">Refuser</button>
      </div>
    </article>
  </template>
  <template id="message-template">
    <article class="message">
      <div class="who"></div>
      <div class="tools"></div>
      <div class="body"></div>
      <details class="context" hidden><summary></summary><pre></pre></details>
      <div class="attachments"></div>
      <button class="listen" type="button">▶ Écouter</button>
    </article>
  </template>
  <script src="links.js"></script>
  <script src="conversation.js"></script>
</body>
</html>
